name: Build OpenWrt for Xiaomi CR8809 (IPQ50xx)

on:
  workflow_dispatch:  # يسمح لك بالضغط على زر "Run workflow" يدوياً
  push:
    branches:
      - ipq50xx-qsdk-kernel-5.4-openwrt-21.02-qsdk-11.5.05.841.1029

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Update and install feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Use preconfigured .config
      run: |
        # بما أن الملف موجود في الجذر، نقوم بتحديثه لتتناسب التبعيات مع النظام
        make defconfig

    - name: Download sources
      run: make -j$(nproc) download

    - name: Build firmware
      run: make -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-xiaomi-cr8809
        path: bin/targets/ipq50xx/
