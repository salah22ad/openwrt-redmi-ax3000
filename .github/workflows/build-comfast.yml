name: Build OpenWrt for Comfast CF-WA350

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          sudo apt-get update
          sudo apt-get install -y build-essential subversion libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 python3-pip rsync swig time git-core diffstat libelf-dev libreadline-dev cmake clang libfuse-dev
          sudo apt-get clean

      - name: Clone OpenWrt Source
        run: |
          git clone https://github.com/hzyitc/openwrt-redmi-ax3000.git openwrt
          # استبدال مجلد target بمجلدك المرفوع الذي يحتوي على دعم Comfast
          cp -r ./target openwrt/target
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Build Settings
        run: |
          cd openwrt
          # إذا كان لديك ملف .config مخصص، استخدمه بدلاً من defconfig
          # cp ../.config .config
          make defconfig

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-comfast-cf-wa350-firmware
          path: openwrt/bin/targets/**/*
