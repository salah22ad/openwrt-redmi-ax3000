name: Redmi AX3000 (Specific Branch)

on:
  workflow_dispatch:
    inputs:
      openwrt_branch:
        description: 'OpenWrt branch to build'
        required: true
        default: 'ipq50xx-qsdk-kernel-5.4-openwrt-21.02-qsdk-11.5.05.841.1029'
        type: string
      include_files:
        description: 'Inject custom files from "files" directory (from cfw-leds repo)'
        required: false
        default: true
        type: boolean
      attach_theme:
        description: 'Import luci-theme-enan-dashboard package and enable it in .config'
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/hzyitc/openwrt-redmi-ax3000.git
  CFW_REPO: https://github.com/haddad2inc/cfw-leds.git
  CFW_DIR: /tmp/cfw-leds-src
  TZ: Asia/Riyadh

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout your repo
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Check disk space before build
      run: |
        echo "=== Disk space before build ==="
        df -h
        du -sh . 2>/dev/null || true

    # -----------------------------------------------------------------------
    # 1. Initialize build log
    # -----------------------------------------------------------------------
    - name: Initialize build log
      run: |
        echo "=== BUILD LOG - $(date) ===" > build.log
        echo "Workflow triggered by: ${{ github.event_name }}" >> build.log
        echo "Repository: ${{ github.repository }}" >> build.log
        echo "Branch: ${{ github.ref_name }}" >> build.log
        echo "Commit: ${{ github.sha }}" >> build.log
        echo "OpenWrt source repo   : $REPO_URL" >> build.log
        echo "OpenWrt branch input  : ${{ github.event.inputs.openwrt_branch }}" >> build.log
        echo "Include custom files  : ${{ github.event.inputs.include_files }}" >> build.log
        echo "Attach theme          : ${{ github.event.inputs.attach_theme }}" >> build.log
        echo "========================================" >> build.log
        echo "Build started at: $(date)" >> build.log
        echo "========================================" >> build.log
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    # -----------------------------------------------------------------------
    # 2. Resolve and validate the branch
    # -----------------------------------------------------------------------
    - name: Resolve and validate branch
      run: |
        REF="${{ github.event.inputs.openwrt_branch }}"
        if [ -z "$REF" ]; then
          echo "❌ ERROR: openwrt_branch input is empty" | tee -a build.log
          exit 1
        fi

        echo "=== Resolved branch selection ===" | tee -a build.log
        echo "Git branch: $REF" | tee -a build.log

        # Verify the branch exists (as head) in the source repo
        if git ls-remote --heads "$REPO_URL" "$REF" | grep -q "refs/heads/$REF"; then
          echo "✅ Branch '$REF' exists in $REPO_URL" | tee -a build.log
        else
          echo "⚠️ Branch '$REF' not found as a head. Checking tags..."
          if git ls-remote --tags "$REPO_URL" "$REF" | grep -q "refs/tags/$REF"; then
            echo "✅ Found as tag: $REF" | tee -a build.log
          else
            echo "❌ ERROR: Branch/tag '$REF' does not exist in $REPO_URL" | tee -a build.log
            echo "--- Last 20 branches ---" | tee -a build.log
            git ls-remote --heads "$REPO_URL" 2>&1 | awk -F'refs/heads/' '{print $2}' | sort | tail -20 | tee -a build.log
            exit 1
          fi
        fi

        echo "OPENWRT_REF=$REF" >> "$GITHUB_ENV"

    # -----------------------------------------------------------------------
    # 3. Initialize environment
    # -----------------------------------------------------------------------
    - name: Initialize environment
      run: |
        echo "=== Initializing environment ===" | tee -a build.log
        sudo apt update 2>&1 | tee -a build.log
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext libncurses5-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev file wget curl \
          libelf-dev autoconf automake libtool binutils bzip2 \
          diffutils patch perl sed xz-utils coreutils findutils bash 2>&1 | tee -a build.log

    # -----------------------------------------------------------------------
    # 4. Clone OpenWrt source (specific branch)
    # -----------------------------------------------------------------------
    - name: Clone OpenWrt source (specific branch)
      run: |
        echo "=== Cloning OpenWrt source ===" | tee -a build.log
        echo "Repo   : $REPO_URL" | tee -a build.log
        echo "Branch : $OPENWRT_REF" | tee -a build.log

        git clone --depth 1 --branch "$OPENWRT_REF" "$REPO_URL" openwrt 2>&1 | tee -a build.log
        cd openwrt
        echo "=== Actual checked-out commit ===" | tee -a ../build.log
        git log -1 --oneline | tee -a ../build.log
        cd ..
        rm -rf openwrt/.git 2>&1 | tee -a build.log

    - name: Update & Install feeds
      run: |
        echo "=== Updating and installing feeds ===" | tee -a build.log
        cd openwrt
        ./scripts/feeds update -a 2>&1 | tee -a ../build.log
        ./scripts/feeds install -a 2>&1 | tee -a ../build.log

    # -----------------------------------------------------------------------
    # 5. Clone cfw-leds repo once (source for .config, files/ and theme)
    # -----------------------------------------------------------------------
    - name: Clone cfw-leds repo (for .config, files and theme)
      run: |
        echo "=== Cloning cfw-leds repo ===" | tee -a build.log
        echo "Repo: $CFW_REPO" | tee -a build.log
        rm -rf "$CFW_DIR"
        if git clone --depth 1 "$CFW_REPO" "$CFW_DIR" 2>&1 | tee -a build.log; then
          echo "✅ Clone succeeded." | tee -a build.log
        else
          echo "❌ Clone FAILED." | tee -a build.log
          exit 1
        fi
        rm -rf "$CFW_DIR/.git"
        echo "=== Contents of cfw-leds repo ===" | tee -a build.log
        ls -la "$CFW_DIR" | tee -a build.log

    # -----------------------------------------------------------------------
    # 6. Inject custom files from cfw-leds repo (optional)
    # -----------------------------------------------------------------------
    - name: Inject custom files from cfw-leds repo
      if: ${{ github.event.inputs.include_files == 'true' }}
      run: |
        echo "=== Injecting custom files ===" | tee -a build.log
        if [ -d "$CFW_DIR/files" ]; then
          mkdir -p openwrt/files
          cp -rv "$CFW_DIR/files/." openwrt/files/ 2>&1 | tee -a build.log
          echo "✅ Custom files injected into openwrt/files/" | tee -a build.log
          echo "=== Listing injected files ===" | tee -a build.log
          find openwrt/files -type f | head -n 200 | tee -a build.log
        else
          echo "⚠️ No 'files' directory found in cfw-leds repo — skipping." | tee -a build.log
        fi

    # -----------------------------------------------------------------------
    # 7. Import luci-theme-enan-dashboard package (optional)
    # -----------------------------------------------------------------------
    - name: Import luci-theme-enan-dashboard package
      if: ${{ github.event.inputs.attach_theme == 'true' }}
      run: |
        echo "=== Importing luci-theme-enan-dashboard package ===" | tee -a build.log
        SRC_DIR="$CFW_DIR/luci-theme-enan-dashboard"
        TARGET_PARENT="openwrt/package"
        TARGET_DIR="$TARGET_PARENT/luci-theme-enan-dashboard"

        echo "Source path       : $SRC_DIR" | tee -a build.log
        echo "Target parent     : $TARGET_PARENT" | tee -a build.log
        echo "Expected final path: $TARGET_DIR" | tee -a build.log

        if [ ! -d "$SRC_DIR" ]; then
          echo "❌ ERROR: Expected subfolder '$SRC_DIR' not found." | tee -a build.log
          echo "--- Listing cfw-leds repo root ---" | tee -a build.log
          ls -la "$CFW_DIR" | tee -a build.log
          exit 1
        fi

        mkdir -p "$TARGET_PARENT"
        rm -rf "$TARGET_DIR"

        if cp -rv "$SRC_DIR" "$TARGET_PARENT"/ 2>&1 | tee -a build.log; then
          echo "✅ Copy to $TARGET_PARENT succeeded." | tee -a build.log
        else
          echo "❌ Copy FAILED." | tee -a build.log
          exit 1
        fi

        echo "=== Listing imported files ===" | tee -a build.log
        find "$TARGET_DIR" -type f -exec ls -lh {} \; 2>&1 | tee -a build.log

        echo "=== Applying permissions ===" | tee -a build.log
        chmod -R u+rwX,go+rX "$TARGET_DIR" 2>&1 | tee -a build.log
        find "$TARGET_DIR" -type f -name "*.sh" -exec chmod +x {} \; 2>&1 | tee -a build.log
        find "$TARGET_DIR" -type f -name "Makefile" -exec chmod 644 {} \; 2>&1 | tee -a build.log
        find "$TARGET_DIR/files" -type f -exec chmod +x {} \; 2>/dev/null || true

        echo "=== Verifying Makefile presence ===" | tee -a build.log
        if [ -f "$TARGET_DIR/Makefile" ]; then
          echo "✅ Makefile found at $TARGET_DIR/Makefile" | tee -a build.log
          echo "--- Makefile header (first 20 lines) ---" | tee -a build.log
          head -n 20 "$TARGET_DIR/Makefile" | tee -a build.log
        else
          echo "❌ ERROR: Makefile NOT found in $TARGET_DIR" | tee -a build.log
          exit 1
        fi

        echo "✅ luci-theme-enan-dashboard package import completed." | tee -a build.log

    # -----------------------------------------------------------------------
    # 8. Import .config from cfw-leds repo (with fallback)
    # -----------------------------------------------------------------------
    - name: Copy .config from cfw-leds repo (with fallback)
      run: |
        echo "=== Copying .config from cfw-leds repo ===" | tee -a build.log
        if [ -f "$CFW_DIR/.config" ]; then
          cp -v "$CFW_DIR/.config" openwrt/.config 2>&1 | tee -a build.log
          echo "✅ .config imported from cfw-leds repo." | tee -a build.log
        else
          echo "⚠️ .config not found in cfw-leds repo — applying fallback config." | tee -a build.log
          sed 's/^ *//' > openwrt/.config <<'EOF'
          CONFIG_TARGET_ipq50xx=y
          CONFIG_TARGET_ipq50xx_arm=y
          CONFIG_TARGET_BOARD="ipq50xx"
          CONFIG_TARGET_SUBTARGET="arm"
          CONFIG_TARGET_PROFILE="DEVICE_redmi_ax3000"
          CONFIG_TARGET_ARCH_PACKAGES="arm_cortex-a7_neon-vfpv4"
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-light=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          EOF
          echo "✅ Fallback .config written." | tee -a build.log
        fi

    # -----------------------------------------------------------------------
    # 9. Verify and prepare .config (inject theme + fallback essential opts)
    # -----------------------------------------------------------------------
    - name: Verify and prepare .config
      run: |
        echo "=== Verifying .config ===" | tee -a build.log
        cd openwrt
        cp .config config-before.txt

        # --- 9.1 Force fallback essentials if missing (in case import produced partial file) ---
        echo "=== Ensuring essential target options exist ===" | tee -a ../build.log
        ensure_opt() {
          local line="$1"
          local key="${line%%=*}"
          if ! grep -q "^${key}=" .config; then
            echo "⚠️ Missing '${key}', adding fallback: $line" | tee -a ../build.log
            echo "$line" >> .config
          fi
        }
        ensure_opt 'CONFIG_TARGET_ipq50xx=y'
        ensure_opt 'CONFIG_TARGET_ipq50xx_arm=y'
        ensure_opt 'CONFIG_TARGET_BOARD="ipq50xx"'
        ensure_opt 'CONFIG_TARGET_SUBTARGET="arm"'
        ensure_opt 'CONFIG_TARGET_PROFILE="DEVICE_redmi_ax3000"'
        ensure_opt 'CONFIG_TARGET_ARCH_PACKAGES="arm_cortex-a7_neon-vfpv4"'
        ensure_opt 'CONFIG_PACKAGE_luci=y'
        ensure_opt 'CONFIG_PACKAGE_luci-light=y'
        ensure_opt 'CONFIG_PACKAGE_uhttpd=y'
        ensure_opt 'CONFIG_PACKAGE_uhttpd-mod-ubus=y'

        # --- 9.2 Inject theme option if requested ---
        if [ "${{ github.event.inputs.attach_theme }}" = "true" ]; then
          echo "=== Injecting CONFIG_PACKAGE_luci-theme-enan-dashboard=y ===" | tee -a ../build.log
          if ! grep -q "^CONFIG_PACKAGE_luci-theme-enan-dashboard=y" .config; then
            echo "CONFIG_PACKAGE_luci-theme-enan-dashboard=y" >> .config
          fi
          echo "✅ Theme option present in .config" | tee -a ../build.log
        fi

        # --- 9.3 Print active options BEFORE defconfig ---
        echo "=== Active options BEFORE defconfig (imported from repo/fallback) ===" | tee -a ../build.log
        echo "Count of enabled options (y/m):" | tee -a ../build.log
        grep -E '^CONFIG_.*=[ym]' .config | wc -l | tee -a ../build.log
        echo "Listing all enabled options:" | tee -a ../build.log
        grep -E '^CONFIG_.*=[ym]' .config | sort | tee -a ../build.log

        # --- 9.4 Check target device BEFORE defconfig ---
        echo "=== Checking target device BEFORE defconfig ===" | tee -a ../build.log
        if grep -q "CONFIG_TARGET_ipq50xx_arm_DEVICE_redmi_ax3000=y" .config; then
          echo "✅ Target device correctly set BEFORE defconfig." | tee -a ../build.log
        else
          echo "⚠️ Target device NOT set BEFORE defconfig. It will be added after." | tee -a ../build.log
        fi

        # --- 9.5 olddefconfig then defconfig ---
        echo "=== Running make olddefconfig ===" | tee -a ../build.log
        make olddefconfig 2>&1 | tee -a ../build.log

        echo "=== Running make defconfig ===" | tee -a ../build.log
        make defconfig 2>&1 | tee -a ../build.log

        cp .config config-after.txt

        # --- 9.6 Re-force target device if missing after defconfig ---
        echo "=== Checking target device AFTER defconfig ===" | tee -a ../build.log
        if ! grep -q "CONFIG_TARGET_ipq50xx_arm_DEVICE_redmi_ax3000=y" .config; then
          echo "⚠️ Target device option missing after defconfig, re-adding..." | tee -a ../build.log
          echo "CONFIG_TARGET_ipq50xx=y" >> .config
          echo "CONFIG_TARGET_ipq50xx_arm=y" >> .config
          echo "CONFIG_TARGET_ipq50xx_arm_DEVICE_redmi_ax3000=y" >> .config
          make defconfig 2>&1 | tee -a ../build.log
          cp .config config-after.txt
        else
          echo "✅ Target device still correctly set AFTER defconfig." | tee -a ../build.log
        fi

        # --- 9.7 Print options AFTER defconfig ---
        echo "=== Active options AFTER defconfig ===" | tee -a ../build.log
        echo "Count of enabled options (y/m):" | tee -a ../build.log
        grep -E '^CONFIG_.*=[ym]' .config | wc -l | tee -a ../build.log
        echo "Listing all enabled options:" | tee -a ../build.log
        grep -E '^CONFIG_.*=[ym]' .config | sort | tee -a ../build.log

        # --- 9.8 Diff ---
        echo "=== Diff between BEFORE and AFTER defconfig ===" | tee -a ../build.log
        diff -u <(grep -v '^#' config-before.txt | grep -v '^$' | sort) \
               <(grep -v '^#' config-after.txt  | grep -v '^$' | sort) 2>&1 | tee -a ../build.log || true

        # --- 9.9 Essential image build options ---
        echo "=== Checking essential image build options AFTER defconfig ===" | tee -a ../build.log
        for opt in CONFIG_TARGET_ROOTFS_SQUASHFS CONFIG_TARGET_ROOTFS_INITRAMFS; do
          if grep -q "$opt=y" .config; then
            echo "✅ $opt is enabled." | tee -a ../build.log
          else
            echo "⚠️ $opt is NOT enabled. This may result in missing firmware files." | tee -a ../build.log
          fi
        done

        echo "✅ .config verification completed." | tee -a ../build.log

    - name: Upload config snapshots (before/after)
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: config-snapshots-${{ github.sha }}
        path: |
          openwrt/config-before.txt
          openwrt/config-after.txt
        if-no-files-found: warn

    # -----------------------------------------------------------------------
    # 10. Download package sources & clean
    # -----------------------------------------------------------------------
    - name: Download package sources
      run: |
        echo "=== Downloading package sources ===" | tee -a build.log
        cd openwrt
        make download -j$(nproc) 2>&1 | tee -a ../build.log
        find dl -size -1024c -exec rm -f {} \; 2>&1 | tee -a ../build.log
        rm -rf dl/*.tmp 2>&1 | tee -a ../build.log

    - name: Clean previous build artifacts (if any)
      run: |
        echo "=== Cleaning previous build artifacts ===" | tee -a build.log
        cd openwrt
        rm -rf build_dir staging_dir 2>&1 | tee -a ../build.log

    # -----------------------------------------------------------------------
    # 11. Build OpenWrt
    # -----------------------------------------------------------------------
    - name: Build OpenWrt (using all available cores)
      run: |
        echo "=== Building OpenWrt ===" | tee -a build.log
        echo "Git branch: $OPENWRT_REF" | tee -a build.log
        echo "Build started at: $(date)" | tee -a build.log
        cd openwrt
        make -j$(nproc) V=s 2>&1 | tee -a ../build.log
        echo "Build finished at: $(date)" | tee -a build.log
      timeout-minutes: 360

    # -----------------------------------------------------------------------
    # 12. List outputs, clean, and check disk
    # -----------------------------------------------------------------------
    - name: List all files in bin/targets/ipq50xx/arm/
      run: |
        echo "=== Contents of bin/targets/ipq50xx/arm/ ===" | tee -a build.log
        cd openwrt
        if [ -d bin/targets/ipq50xx/arm/ ]; then
          ls -la bin/targets/ipq50xx/arm/ 2>&1 | tee -a ../build.log
          find bin/targets/ipq50xx/arm/ -type f -exec ls -lh {} \; 2>&1 | tee -a ../build.log
          if [ -z "$(find bin/targets/ipq50xx/arm/ -name '*.bin' -o -name '*.img' -o -name '*.tar' -o -name '*.itb' 2>/dev/null)" ]; then
            echo "⚠️ No firmware files found. Attempting to build image separately..." | tee -a ../build.log
            make target/install 2>&1 | tee -a ../build.log
            ls -la bin/targets/ipq50xx/arm/ 2>&1 | tee -a ../build.log
          fi
        else
          echo "❌ Directory bin/targets/ipq50xx/arm/ does not exist!" | tee -a ../build.log
          echo "--- Available target directories ---" | tee -a ../build.log
          find bin/targets/ -maxdepth 2 -type d 2>&1 | tee -a ../build.log || true
        fi

    - name: Verify firmware files exist before upload
      if: always()
      run: |
        echo "=== Verifying firmware files matching redmi_ax3000 pattern ===" | tee -a build.log
        DIR="openwrt/bin/targets/ipq50xx/arm"
        if [ -d "$DIR" ]; then
          echo "--- Matching firmware files ---" | tee -a build.log
          ls -lh "$DIR"/openwrt-ipq50xx-arm-redmi_ax3000* 2>&1 | tee -a build.log || echo "⚠️ No matching firmware files found!" | tee -a build.log
          echo "--- Metadata files ---" | tee -a build.log
          for f in sha256sums config.buildinfo BUILD-INFO.txt; do
            if [ -f "$DIR/$f" ]; then
              echo "✅ $f exists" | tee -a build.log
            else
              echo "⚠️ $f is MISSING" | tee -a build.log
            fi
          done
        else
          echo "❌ Directory $DIR does not exist!" | tee -a build.log
        fi

    - name: Clean temporary build directories (free space for packaging)
      run: |
        echo "=== Cleaning build_dir and staging_dir ===" | tee -a build.log
        cd openwrt
        rm -rf build_dir staging_dir 2>&1 | tee -a ../build.log

    - name: Check disk space after build
      run: |
        echo "=== Disk space after build ===" | tee -a build.log
        df -h 2>&1 | tee -a build.log
        du -sh openwrt 2>&1 | tee -a build.log || true

    # -----------------------------------------------------------------------
    # 13. Upload logs
    # -----------------------------------------------------------------------
    - name: Finalize build log (no push to repo)
      if: always()
      run: |
        echo "=== BUILD LOG END - $(date) ===" >> build.log
        echo "Build completed with status: ${{ job.status }}" >> build.log
        echo "Git branch: $OPENWRT_REF" >> build.log
        echo "✅ Log finalized (not pushed to repository)."

    - name: Upload full log as artifact (always)
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: full-build-log-${{ github.sha }}
        path: build.log
        if-no-files-found: warn

    # -----------------------------------------------------------------------
    # 14. Upload firmware artifacts (only redmi_ax3000 files + metadata)
    # -----------------------------------------------------------------------
    - name: Upload firmware and selected metadata (redmi_ax3000 only)
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: redmi-ax3000-${{ github.sha }}
        path: |
          openwrt/bin/targets/ipq50xx/arm/openwrt-ipq50xx-arm-redmi_ax3000*
          openwrt/bin/targets/ipq50xx/arm/sha256sums
          openwrt/bin/targets/ipq50xx/arm/config.buildinfo
          openwrt/bin/targets/ipq50xx/arm/BUILD-INFO.txt
        if-no-files-found: warn
